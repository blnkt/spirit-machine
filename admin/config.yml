# Decap CMS Configuration File

# local_backend: true

backend:
  name: git-gateway
  branch: main

site_url: https://spirit-machine.netlify.app/

media_folder: "static/img"

collections:
  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Site settings"
        file: "_data/site.json"
        fields:
          - { label: "Choir name", name: "choirName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - label: "Social links"
            name: "social"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }
      - name: "videos"
        label: "Videos page"
        file: "_data/videos.json"
        fields:
          - label: "Sections"
            name: "sections"
            widget: "list"
            summary: "{{fields.heading}}"
            fields:
              - { label: "Heading", name: "heading", widget: "string" }
              - { label: "Description", name: "description", widget: "markdown", required: false }
              - label: "Videos"
                name: "videos"
                widget: "list"
                summary: "{{fields.title}}"
                fields:
                  - { label: "YouTube video ID", name: "youtubeId", widget: "string", hint: "The ID from youtube.com/watch?v=VIDEO_ID" }
                  - { label: "Title", name: "title", widget: "string", required: false }

  - name: "events"
    label: "Event"
    folder: "events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Start date", name: "startDate", widget: "datetime" }
      - { label: "End date", name: "endDate", widget: "datetime", required: false }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Ticket URL", name: "ticketUrl", widget: "string", required: false }
      - { label: "Featured on home", name: "featured", widget: "boolean", default: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "pages"
    label: "Page"
    folder: "pages"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime", required: false }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Meta description", name: "metaDescription", widget: "text", required: false }
      - label: "Navigation"
        name: "eleventyNavigation"
        widget: "object"
        required: false
        fields:
          - { label: "Key", name: "key", widget: "string" }
          - { label: "Order", name: "order", widget: "number", default: 0, value_type: "int" }
      - { label: "Body", name: "body", widget: "markdown" }
