# Decap CMS Configuration File

backend:
  name: git-gateway
  branch: master

# site_url: https://spiritmachine.example

media_folder: "static/img"

collections:
  - name: "settings"
    label: "Site settings"
    files:
      - name: "site"
        label: "Site settings"
        file: "_data/site.json"
        fields:
          - { label: "Choir name", name: "choirName", widget: "string" }
          - { label: "Tagline", name: "tagline", widget: "string", required: false }
          - { label: "Contact email", name: "contactEmail", widget: "string" }
          - { label: "Donate URL", name: "donateUrl", widget: "string" }
          - label: "Social links"
            name: "social"
            widget: "list"
            fields:
              - { label: "Label", name: "label", widget: "string" }
              - { label: "URL", name: "url", widget: "string" }

  - name: "events"
    label: "Event"
    folder: "events"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Start date", name: "startDate", widget: "datetime" }
      - { label: "End date", name: "endDate", widget: "datetime", required: false }
      - { label: "Venue", name: "venue", widget: "string" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - { label: "Ticket URL", name: "ticketUrl", widget: "string", required: false }
      - { label: "Featured on home", name: "featured", widget: "boolean", default: false }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "music"
    label: "Release"
    folder: "music"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Release type", name: "releaseType", widget: "string", hint: "e.g. Single, Album, Live" }
      - { label: "Year", name: "year", widget: "number" }
      - { label: "Cover image", name: "coverImage", widget: "image", required: false }
      - { label: "Listen URL", name: "listenUrl", widget: "string", required: false }
      - { label: "Featured on home", name: "featured", widget: "boolean", default: false }
      - { label: "Sort order", name: "order", widget: "number", default: 0, value_type: "int" }

  - name: "news"
    label: "News"
    folder: "posts"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime" }
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Tags", name: "tags", widget: "list", default: ["post"] }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "pages"
    label: "Page"
    folder: "pages"
    create: false
    slug: "{{slug}}"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Publish date", name: "date", widget: "datetime", required: false }
      - { label: "Permalink", name: "permalink", widget: "string", required: false }
      - { label: "Meta description", name: "metaDescription", widget: "text", required: false }
      - label: "Navigation"
        name: "eleventyNavigation"
        widget: "object"
        required: false
        fields:
          - { label: "Key", name: "key", widget: "string" }
          - { label: "Order", name: "order", widget: "number", default: 0, value_type: "int" }
      - { label: "Body", name: "body", widget: "markdown" }
